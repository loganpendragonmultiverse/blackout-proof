[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "blackout-proof"
version = "1.1.0"
description = "Verify PDFs locally for residual content and hidden-data redaction risks."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Logan Pendragon Multiverse" }]
dependencies = ["PyMuPDF>=1.26.3,<2"]
[project.optional-dependencies]
dev = ["build>=1.3,<2", "mypy>=1.15,<3", "pip-audit>=2.9,<3", "pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]
[project.scripts]
blackout-proof = "blackout_proof.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 100
target-version = "py310"
[tool.mypy]
python_version = "3.10"
strict = true
[[tool.mypy.overrides]]
module = "pymupdf"
ignore_missing_imports = true
[tool.coverage.run]
omit = ["src/*/__main__.py"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=blackout_proof --cov-branch --cov-report=term-missing --cov-fail-under=90"
